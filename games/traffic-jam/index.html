<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Traffic Jam — Parking Escape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <a class="back-link" href="../../index.html">&larr; All puzzles</a>
    <header class="topbar">
      <h1>🚗 Traffic Jam</h1>
      <p class="tagline">Slide the parked cars out of the way and drive your red car through the exit.</p>
    </header>

    <div class="levels" id="levelBar"></div>

    <div class="hud">
      <div class="stat">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="moveCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timeCount">0:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="bestCount">–</span>
      </div>
      <button class="btn" id="resetBtn">Reset</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="Parking lot puzzle board"></div>
    </div>

    <p class="hint">Drag a car along its lane, or click to select it and use the arrow keys.</p>

    <div class="win-overlay" id="winOverlay" hidden>
      <div class="win-card">
        <h2>🏁 You're out!</h2>
        <p id="winStats"></p>
        <div class="win-actions">
          <button class="btn" id="replayBtn">Replay</button>
          <button class="btn btn-primary" id="nextBtn">Next Level</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
